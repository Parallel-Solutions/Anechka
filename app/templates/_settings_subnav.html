{% set p = request.url.path %}
<nav class="nav nav-pills mb-4">
    {% if request.state.user and request.state.user.role == 'admin' %}
    <a class="nav-link{% if p == '/settings' %} active{% endif %}" href="/settings">Настройки</a>
    <a class="nav-link{% if p.startswith('/settings/users') %} active{% endif %}" href="/settings/users">Пользователи</a>
    {% endif %}
    <a class="nav-link{% if p.startswith('/exports') %} active{% endif %}" href="/exports">История</a>
    {% if request.state.user and request.state.user.role == 'admin' %}
    <a class="nav-link{% if p.startswith('/bitrix-import') %} active{% endif %}" href="/bitrix-import">CRM Импорт</a>
    {% endif %}
</nav>
