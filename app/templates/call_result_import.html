{% extends "base.html" %}

{% block title %}Импорт #{{ import_id }} — результаты прозвона{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-start mb-3">

    <div>

        <h1 class="h3 mb-1">Подготовка данных для Битрикс24</h1>

        <p class="text-muted mb-0"><span id="import-meta">{{ import_rec.original_filename }}</span></p>

    </div>

    <div class="d-flex gap-2 flex-wrap justify-content-end">
        <button class="btn btn-success btn-sm" id="btn-send-and-export" disabled>Отправить в Битрикс и выгрузить автобзвон</button>
        <button class="btn btn-outline-info btn-sm d-none" id="btn-retry-llm" disabled>Повторить ИИ</button>
        <button class="btn btn-outline-warning btn-sm" id="btn-restart">Запустить заново</button>
        <button class="btn btn-outline-danger btn-sm" id="btn-delete-import">Удалить импорт</button>
        <a href="/call-results" class="btn btn-outline-secondary btn-sm">К списку</a>
    </div>

</div>



<div id="import-alert"></div>

<div id="import-progress" class="card mb-3 d-none">
    <div class="card-body py-3">
        <div class="d-flex justify-content-between mb-2">
            <span id="import-progress-label">Обработка импорта…</span>
            <span id="import-progress-text" class="text-muted small"></span>
        </div>
        <div class="progress" style="height: 20px;">
            <div id="import-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
        </div>
    </div>
</div>

<div id="summary-cards" class="row g-3 mb-3"></div>

<div id="filtered-list-block" class="mb-4"></div>



<div class="modal fade" id="row-view-modal" tabindex="-1" aria-labelledby="row-view-title" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="row-view-title">Контакт</h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>

            </div>

            <div class="modal-body" id="row-view-body"></div>

            <div class="modal-footer" id="row-view-footer"></div>

        </div>

    </div>

</div>



<div class="modal fade" id="filter-send-modal" tabindex="-1" aria-labelledby="filter-send-title" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="filter-send-title">Отправка в Битрикс24</h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>

            </div>

            <div class="modal-body">

                <div id="filter-send-warning" class="alert alert-warning d-none mb-3"></div>

                <div id="filter-send-progress" class="filter-send-progress d-none mb-3"></div>

                <div id="filter-send-body"></div>

            </div>

            <div class="modal-footer">

                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>

                <button type="button" class="btn btn-success" id="btn-filter-send-confirm">Отправить в Битрикс24</button>

            </div>

        </div>

    </div>

</div>


{% endblock %}

{% block scripts %}

<script>

window.CALL_RESULT_IMPORT_ID = {{ import_id }};

</script>

<script src="/static/js/call_results.js?v=20250707b"></script>

<script>initCallResultImportPage({{ import_id }});</script>

{% endblock %}
