<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Bitrix24 Export</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css?v=20250706" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 420px;">
    <div class="text-center mb-4">
        <h1 class="h3 fw-semibold">Bitrix24 Export</h1>
        <p class="text-muted mb-0">Вход в систему</p>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
            <form id="login-form">
                <input type="hidden" id="next-url" value="{{ next_url }}">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="login-submit">Войти</button>
            </form>
        </div>
    </div>
</main>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');
    errorEl.classList.add('d-none');
    submitBtn.disabled = true;
    try {
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            }),
        });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            const msg = data.detail?.message || data.detail || 'Неверный email или пароль';
            errorEl.textContent = typeof msg === 'string' ? msg : 'Неверный email или пароль';
            errorEl.classList.remove('d-none');
            return;
        }
        window.location.href = document.getElementById('next-url').value || '/';
    } finally {
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
