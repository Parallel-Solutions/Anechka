{% extends "base.html" %}
{% block title %}Пользователи — Bitrix24 Export{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Пользователи</h1>
<div id="users-alert" class="alert d-none" role="alert"></div>

<div class="card shadow-sm mb-4">
    <div class="card-header fw-semibold">Новый пользователь</div>
    <div class="card-body">
        <form id="create-user-form" class="row g-3">
            <div class="col-md-3">
                <label class="form-label" for="new-email">Email</label>
                <input type="email" class="form-control" id="new-email" required>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="new-display-name">Имя</label>
                <input type="text" class="form-control" id="new-display-name">
            </div>
            <div class="col-md-2">
                <label class="form-label" for="new-bitrix-id">ID в Bitrix</label>
                <input type="number" class="form-control" id="new-bitrix-id" min="1" step="1">
            </div>
            <div class="col-md-3">
                <label class="form-label" for="new-password">Пароль</label>
                <input type="password" class="form-control" id="new-password" required minlength="6">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Создать</button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Email</th>
                    <th>Имя</th>
                    <th>ID Bitrix</th>
                    <th>Статус</th>
                    <th class="text-end">Действия</th>
                </tr>
                </thead>
                <tbody id="users-table-body">
                <tr><td colspan="5" class="text-muted p-3">Загрузка…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/settings_users.js?v=20250706b"></script>
{% endblock %}
